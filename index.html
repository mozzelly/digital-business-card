<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Digital Business Card">

    <title>Mozz Elly | Digital Business Card</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="card">

        <!-- Top Actions -->
        <div class="top-actions">
            <button class="icon-btn" onclick="shareCard()" aria-label="Share card">
                ↗
            </button>
        </div>


        <!-- Profile -->
        <section class="profile">

            <div class="profile-image">
                <img src="assets/profile.jpg" alt="Mozz Elly">
            </div>

            <h1>Mozz Elly</h1>

            <p class="profession">
                Creative & Digital Marketing Specialist
            </p>

            <p class="company">
                Mkombozi Digital
            </p>

        </section>


        <!-- Primary Actions -->
        <section class="primary-actions">

            <a href="tel:+255700000000" class="primary-btn">
                <span>☎</span>
                Call
            </a>

            <a href="https://wa.me/255700000000"
               target="_blank"
               class="primary-btn">
                <span>◉</span>
                WhatsApp
            </a>

        </section>


        <!-- Contact Information -->
        <section class="info-section">

            <div class="info-item">

                <div class="info-icon">
                    ✉
                </div>

                <div>
                    <span>Email</span>
                    <strong>hello@example.com</strong>
                </div>

            </div>


            <div class="info-item">

                <div class="info-icon">
                    🌐
                </div>

                <div>
                    <span>Website</span>
                    <strong>www.example.com</strong>
                </div>

            </div>


            <div class="info-item">

                <div class="info-icon">
                    📍
                </div>

                <div>
                    <span>Location</span>
                    <strong>Dar es Salaam, Tanzania</strong>
                </div>

            </div>

        </section>


        <!-- Social Links -->
        <section class="social-section">

            <a href="#" aria-label="Instagram">Instagram</a>

            <a href="#" aria-label="LinkedIn">LinkedIn</a>

            <a href="#" aria-label="Facebook">Facebook</a>

        </section>


        <!-- Save Contact -->
        <button class="save-btn" onclick="saveContact()">
            + Save Contact
        </button>


        <!-- QR -->
        <section class="qr-section">

            <p>Scan to save my contact</p>

            <div class="qr-placeholder">
                QR
            </div>

        </section>


        <footer>
            Digital Business Card
        </footer>

    </main>


    <script src="script.js"></script>

</body>

</html>
